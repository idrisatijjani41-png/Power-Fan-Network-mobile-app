name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fix Google Services Repository
        run: |
          SETTINGS_FILE="android/settings.gradle.kts"
          if [ ! -f "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="android/settings.gradle"
          fi

          if [ -f "$SETTINGS_FILE" ]; then
            if ! grep -q "google()" "$SETTINGS_FILE"; then
              echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' | cat - "$SETTINGS_FILE" > temp && mv temp "$SETTINGS_FILE"
            fi
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
