name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Migrate Android Embedding v2 & Clean Manifest
        run: |
          # 1. Inject Android Embedding v2 into AndroidManifest.xml if missing
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "flutterEmbedding" "$MANIFEST_FILE"; then
              sed -i '/<application/a \        <meta-data android:name="flutterEmbedding" android:value="2" />' "$MANIFEST_FILE"
            fi
          fi

          # 2. Fix MainActivity to use FlutterActivity (Embedding v2)
          KT_FILE=$(find android/app/src/main/kotlin android/app/src/main/java -name "MainActivity.kt" 2>/dev/null | head -n 1)
          if [ -n "$KT_FILE" ]; then
            PACKAGE_NAME=$(grep "^package " "$KT_FILE" | head -n 1)
            cat <<EOF > "$KT_FILE"
$PACKAGE_NAME

import io.flutter.embedding.android.FlutterActivity

class MainActivity: FlutterActivity() {
}
EOF
          fi

          JAVA_FILE=$(find android/app/src/main/java -name "MainActivity.java" 2>/dev/null | head -n 1)
          if [ -n "$JAVA_FILE" ]; then
            PACKAGE_NAME=$(grep "^package " "$JAVA_FILE" | head -n 1)
            cat <<EOF > "$JAVA_FILE"
$PACKAGE_NAME

import io.flutter.embedding.android.FlutterActivity;

public class MainActivity extends FlutterActivity {
}
EOF
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
