name: power_fan_network
description: "POWER FAN NETWORK - Mine FAN. Earn More."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Core & Services
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  cloud_functions: ^5.0.1
  firebase_app_check: ^0.3.0+1

  # Monetization / Ads
  google_mobile_ads: ^5.1.0

  # UI / Helpers
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  provider: ^6.1.2
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
